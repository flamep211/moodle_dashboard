<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мудл Панель - Вход</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background elements */
    body::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -100px;
      left: -100px;
      animation: float 6s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      bottom: -80px;
      right: -80px;
      animation: float 8s ease-in-out infinite 2s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      animation: slideUp 0.6s ease-out;
    }

    .login-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 30px;
      text-align: center;
      color: white;
      position: relative;
    }

    .login-header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent 0%, rgba(255, 255, 255, 0.1) 50%, transparent 100%);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .login-header > * {
      position: relative;
      z-index: 1;
    }

    .login-icon {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 32px;
      animation: slideUp 0.6s ease-out 0.1s both;
      backdrop-filter: blur(10px);
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
      animation: slideUp 0.6s ease-out 0.2s both;
    }

    .login-header p {
      font-size: 14px;
      opacity: 0.9;
      animation: slideUp 0.6s ease-out 0.3s both;
    }

    .login-content {
      padding: 35px 30px;
    }

    .form-group {
      margin-bottom: 20px;
      animation: fadeIn 0.6s ease-out backwards;
    }

    .form-group:nth-child(1) { animation-delay: 0.4s; }
    .form-group:nth-child(2) { animation-delay: 0.5s; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    .form-group input::placeholder {
      color: #a0aec0;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      animation: fadeIn 0.6s ease-out 0.6s both;
      position: relative;
      overflow: hidden;
    }

    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .submit-btn:hover::before {
      left: 100%;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .error-box {
      background: linear-gradient(135deg, #fed7d7 0%, #fecaca 100%);
      border-left: 4px solid #f87171;
      color: #c53030;
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 13px;
      animation: shake 0.5s ease-in-out;
      font-weight: 500;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) scale(1); }
      25% { transform: translateX(-8px) scale(0.98); }
      75% { transform: translateX(8px) scale(0.98); }
    }

    .demo-box {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
      border: 2px dashed rgba(102, 126, 234, 0.3);
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 12px;
      color: #4a5568;
      line-height: 1.6;
      animation: slideUp 0.6s ease-out 0.7s both;
      font-weight: 500;
    }

    .demo-box strong {
      color: #667eea;
      font-weight: 700;
    }

    .demo-box strong {
      color: #667eea;
      display: block;
      margin-bottom: 8px;
    }

    .demo-credential {
      background: white;
      padding: 8px 10px;
      border-radius: 4px;
      margin: 5px 0;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .login-header {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 24px;
      }

      .login-content {
        padding: 25px 20px;
      }

      .login-icon {
        width: 50px;
        height: 50px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">📊</div>
        <h1>Мудл Панель</h1>
        <p>Аналитика качества онлайн-обучения</p>
      </div>

      <div class="login-content">
        <form method="post">
          <div class="form-group">
            <label for="username">Логин</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              placeholder="Введите логин"
              required 
              autofocus
            >
          </div>

          <div class="form-group">
            <label for="password">Пароль</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              placeholder="Введите пароль"
              required
            >
          </div>

          <button type="submit" class="submit-btn">Войти в систему</button>
        </form>

        {% if error %}
          <div class="error-box">⚠️ {{ error }}</div>
        {% endif %}

        <div class="demo-box">
          <strong>Тестовые учетные данные:</strong>
          <div class="demo-credential">👨‍💼 admin / admin123</div>
          <div class="demo-credential">👨‍🏫 teacher / 12345</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
